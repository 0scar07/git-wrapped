name: Publish to npm

# Publica en npm al crear una release en GitHub.
# Requiere el secreto NPM_TOKEN (npmjs.com → Access Tokens → Granular, con permiso de publicación).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # provenance de npm

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
